<title id="cp01-coef-title">Ketidakpastian kontras yang ditetapkan di muka — CP01</title>
<desc id="cp01-coef-desc">Galat baku HC3 lebih besar daripada galat baku klasik untuk kesembilan koefisien penuh; rasio terbesar 1,578 terjadi pada umur, sedangkan uji Wald HC3 blok terak, abu terbang, dan superplasticizer tetap kuat.</desc>
