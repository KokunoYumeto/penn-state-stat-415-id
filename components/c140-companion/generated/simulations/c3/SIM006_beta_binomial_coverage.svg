<title id="title">SIM006: cakupan bersyarat selang binomial pada grid parameter</title>
<desc id="desc">Garis biru penuh menunjukkan cakupan bersyarat selang kredibel berekor sama Beta(2,2), yang berubah menurut p dan jatuh ke nol pada p 0,01 serta 0,99. Garis hijau putus-putus menunjukkan selang kepercayaan Clopper-Pearson, yang berada pada atau di atas garis target merah bertitik 0,95 di seluruh grid p 0,01 sampai 0,99.</desc>
