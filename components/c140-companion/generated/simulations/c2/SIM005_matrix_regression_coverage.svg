<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="430" viewBox="0 0 720 430" role="img" aria-labelledby="title desc">
<title id="title">Cakupan selang regresi pada tiga skenario</title>
<desc id="desc">Diagram batang memperlihatkan cakupan selang 95 persen: Gaussian eksak sekitar 0,948, heteroskedastik dengan galat baku klasik sekitar 0,840, dan heteroskedastik dengan HC3 sekitar 0,943. Garis putus-putus menandai sasaran 0,95.</desc>
<rect width="100%" height="100%" fill="white"/>
<text x="360" y="25" text-anchor="middle" font-family="sans-serif" font-size="17">Cakupan selang 95% untuk koefisien kemiringan</text>
<line x1="95" y1="340.00" x2="685" y2="340.00" stroke="#d1d5db" stroke-width="1"/>
<text x="85" y="345.00" text-anchor="end" font-family="sans-serif" font-size="12">0.70</text>
<line x1="95" y1="290.83" x2="685" y2="290.83" stroke="#d1d5db" stroke-width="1"/>
<text x="85" y="295.83" text-anchor="end" font-family="sans-serif" font-size="12">0.75</text>
<line x1="95" y1="241.67" x2="685" y2="241.67" stroke="#d1d5db" stroke-width="1"/>
<text x="85" y="246.67" text-anchor="end" font-family="sans-serif" font-size="12">0.80</text>
<line x1="95" y1="192.50" x2="685" y2="192.50" stroke="#d1d5db" stroke-width="1"/>
<text x="85" y="197.50" text-anchor="end" font-family="sans-serif" font-size="12">0.85</text>
<line x1="95" y1="143.33" x2="685" y2="143.33" stroke="#d1d5db" stroke-width="1"/>
<text x="85" y="148.33" text-anchor="end" font-family="sans-serif" font-size="12">0.90</text>
<line x1="95" y1="94.17" x2="685" y2="94.17" stroke="#d1d5db" stroke-width="1"/>
<text x="85" y="99.17" text-anchor="end" font-family="sans-serif" font-size="12">0.95</text>
<line x1="95" y1="45.00" x2="685" y2="45.00" stroke="#d1d5db" stroke-width="1"/>
<text x="85" y="50.00" text-anchor="end" font-family="sans-serif" font-size="12">1.00</text>
<line x1="95" y1="94.17" x2="685" y2="94.17" stroke="#111827" stroke-width="2" stroke-dasharray="7 5"/>
<rect x="145" y="96.22" width="105" height="243.78" fill="#2563eb"/>
<text x="197.50" y="88.22" text-anchor="middle" font-family="sans-serif" font-size="13">0.948</text>
<text x="197.50" y="377" text-anchor="middle" font-family="sans-serif" font-size="13">Gaussian eksak</text>
<rect x="325" y="202.74" width="105" height="137.26" fill="#dc2626"/>
<text x="377.50" y="194.74" text-anchor="middle" font-family="sans-serif" font-size="13">0.840</text>
<text x="377.50" y="377" text-anchor="middle" font-family="sans-serif" font-size="13">Hetero klasik</text>
<rect x="505" y="100.89" width="105" height="239.11" fill="#15803d"/>
<text x="557.50" y="92.89" text-anchor="middle" font-family="sans-serif" font-size="13">0.943</text>
<text x="557.50" y="377" text-anchor="middle" font-family="sans-serif" font-size="13">Hetero HC3</text>
<text x="360" y="412" text-anchor="middle" font-family="sans-serif" font-size="12">Garis putus-putus: sasaran nominal 0,95</text>
</svg>
