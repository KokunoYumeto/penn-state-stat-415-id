<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="760" viewBox="0 0 1000 760" role="img" aria-labelledby="cp02-int-title cp02-int-desc">
<title id="cp02-int-title">Interval sel primer CP02: Bayes, Wilson, dan Clopper-Pearson</title>
<desc id="cp02-int-desc">Selang peluang bersarang per sel agregat dengan penyebut primer yang konservatif. Lingkaran bergaris utuh menunjukkan rataan posterior Beta(2,2) dan selang kredibel ekor setara; persegi bergaris putus-putus menunjukkan interval Wilson; belah ketupat bergaris titik menunjukkan interval Clopper-Pearson. Perhitungan bersifat bersyarat dan tidak mengidentifikasi efek kausal pemancar atau tahun.</desc>
