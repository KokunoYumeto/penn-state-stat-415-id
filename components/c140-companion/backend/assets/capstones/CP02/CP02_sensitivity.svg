<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="520" viewBox="0 0 1050 520" role="img" aria-labelledby="cp02-sens-title cp02-sens-desc">
<title id="cp02-sens-title">Sensitivitas CP02 terhadap prior, penyebut, dan penghapusan satu sel (LOO)</title>
<desc id="cp02-sens-desc">Tiga panel sensitivitas. Perubahan rataan posterior sel pada prior wajar mencapai 0,160714285714286; perubahan proporsi teramati pada penyebut liberal mencapai 0,25 dan merepresentasikan estimand populasi percobaan yang berbeda; perubahan rataan posterior gabungan pada penghapusan satu sel (LOO) mencapai 0,00549523305084743. Log faktor Bayes B₁₀ ditampilkan pada skalanya sendiri dan tidak dibandingkan secara numerik dengan perubahan peluang.</desc>
<rect width="100%" height="100%" fill="white"/>
<g font-family="Arial, sans-serif" fill="black">
